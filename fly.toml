# fly.toml app configuration file generated for tallyboard on 2026-10-29T10:12:56Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'tallyboard'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
